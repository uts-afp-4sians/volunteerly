name: keep-warm

# Pings the Render free-plan web service so it doesn't spin down after ~15 min
# of inactivity. Free services cold-boot on the next request, which can exceed
# Render's edge timeout and return a 504. A periodic ping keeps it awake.
#
# Note: GitHub's cron is best-effort and often runs late (5-20+ min) under load,
# so we ping every 10 min to stay safely under the ~15 min idle window.
# This consumes Render free-tier instance hours faster.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Don't pile up runs if a previous one is still going.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://volunteerly-bl7n.onrender.com/health/live"
          # Generous timeout so a cold start (container boot) still gets a hit
          # instead of failing the run; retry a couple of times to ride it out.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is awake."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Health check did not return 200 after 3 attempts (last: $code)"
          exit 0
